app:
  host: 127.0.0.1
  port: 8000
  database_path: data/worker.sqlite3
  workspace_dir: workspaces
  interval_seconds: 300
  clone_retention_limit: 8

# Authentication is pluggable (see app/auth.py). This build defaults to the
# simple built-in username/password sign in / sign out.
#   provider: login_page    -> built-in username/password form (this default)
#   provider: proxy_header  -> trust an SSO/reverse-proxy header instead
auth:
  provider: login_page
  header: X-Forwarded-User
  display_name_header: X-Forwarded-Preferred-Username
  default_user: local
  allowed_users: []
  admin_users: []
  # Simple login: if no users exist yet, a default admin account is seeded with
  # these credentials on first start. Sign in, then change it or add real users
  # with `python -m app add-user <name> --admin`.
  default_username: admin
  default_password: admin
  session_secret: change-me-to-a-long-random-string

# When enabled, each run executes the Claude agent inside a throwaway container
# (build the image with: docker build -t claude-worker-agent:latest ./docker).
# Leave disabled for host-subprocess execution (dev / Windows).
docker:
  enabled: false
  image: claude-worker-agent:latest
  workspace_mount: /workspace
  network: bridge
  memory: ""
  cpus: ""
  extra_args: []

# Note: jira / git / claude / ui below are DEFAULTS. Each user overrides them on
# the per-user Settings page; their values are stored under their username.
jira:
  url: https://your-domain.atlassian.net
  email: you@example.com
  token: paste-jira-token-here
  jql: assignee = currentUser() ORDER BY updated DESC
  excluded_statuses:
    - Review
    - Done
  required_text: ""
  max_results: 25

git:
  username: ""
  token: ""
  remote_name: origin
  default_repo_url: git@github.com:alonlot/Claude_worker.git
  default_base_branch: main

claude:
  command: claude
  args: []
  model: ""
  api_key: ""
  timeout_seconds: 7200
  allow_cr_fix: true
  auto_cr_fix: false

ui:
  title: Jira Claude Worker
