app:
  host: 127.0.0.1
  port: 8000
  database_path: data/worker.sqlite3
  workspace_dir: workspaces
  interval_seconds: 300
  clone_retention_limit: 8

# Authentication is pluggable (see app/auth.py).
#   provider: proxy_header  -> trust an SSO/reverse-proxy header (production)
#   provider: login_page    -> built-in username/password form (`python -m app add-user`)
auth:
  provider: proxy_header
  header: X-Forwarded-User
  display_name_header: X-Forwarded-Preferred-Username
  # Fallback user when no proxy header/session is present. Set to "" on a real
  # server so the proxy must authenticate. Defaults to the local dev user.
  default_user: local
  allowed_users: []
  admin_users: []
  session_secret: change-me-to-a-long-random-string

# When enabled, each run executes the Claude agent inside a throwaway container
# (build the image with: docker build -t claude-worker-agent:latest ./docker).
# Leave disabled for host-subprocess execution (dev / Windows).
docker:
  enabled: false
  image: claude-worker-agent:latest
  workspace_mount: /workspace
  network: bridge
  memory: ""
  cpus: ""
  extra_args: []

# Note: jira / git / claude / ui below are DEFAULTS. Each user overrides them on
# the per-user Settings page; their values are stored under their username.
jira:
  url: https://your-domain.atlassian.net
  email: you@example.com
  token: paste-jira-token-here
  jql: assignee = currentUser() ORDER BY updated DESC
  excluded_statuses:
    - Review
    - Done
  required_text: ""
  max_results: 25
  # Write-back (off by default keeps the worker read-only). When enabled, a
  # finished run can comment on the Jira issue and move it to a target status.
  writeback_enabled: false
  writeback_transition: ""   # e.g. "In Review"; blank = do not transition
  writeback_comment: true    # post branch / commit / PR link / run report

git:
  username: ""
  token: ""
  remote_name: origin
  default_repo_url: git@github.com:alonlot/Claude_worker.git
  default_base_branch: main

claude:
  command: claude
  args: []
  model: ""
  api_key: ""
  timeout_seconds: 7200
  allow_cr_fix: true
  auto_cr_fix: false

ui:
  title: Jira Claude Worker

# Outbound notifications (per user) for run events: finished, needs CR fix,
# failed, or the agent is waiting for an answer. Both channels are optional.
notify:
  email_enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  smtp_use_tls: true
  email_from: ""
  email_to: ""             # comma-separated recipients
  webhook_enabled: false
  webhook_url: ""          # Slack/Mattermost incoming webhook or any JSON endpoint

# Run the repo's own tests before a run is marked done / pushed. A non-zero exit
# routes the run to needs_cr_fix (so the failure can be fixed) and blocks push.
test_gate:
  enabled: false
  command: ""              # e.g. "pytest -q" or "npm test" (runs in the workspace)
  timeout_seconds: 1800
